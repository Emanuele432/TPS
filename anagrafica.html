<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Anagrafica Unica</title>

<style>
body { font-family: Arial; padding: 20px; }
input { margin: 5px 0; padding: 8px; width: 250px; }
button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { border: 1px solid black; padding: 8px; text-align: center; }
th { background-color: #ddd; }
</style>

<script>
function validaInput(persona) {

let regexNome = /^[A-Za-zÀ-ÿ]+$/;
let regexCognome = /^[A-Za-zÀ-ÿ]+$/;
let regexCAP = /^[0-9]{5}$/;
let regexCitta = /^[A-Za-zÀ-ÿ\s]+$/;
let regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let regexTelefono = /^[0-9]{8,15}$/;

if (!regexNome.test(persona.nome)) {
alert("Nome non valido (solo lettere)");
return false;
}

if (!regexCognome.test(persona.cognome)) {
alert("Cognome non valido (solo lettere)");
return false;
}

if (!regexCAP.test(persona.cap)) {
alert("CAP non valido (5 numeri)");
return false;
}

if (!regexCitta.test(persona.citta)) {
alert("Città non valida (solo lettere e spazi)");
return false;
}

if (!regexEmail.test(persona.email)) {
alert("Email non valida");
return false;
}

if (!regexTelefono.test(persona.telefono)) {
alert("Telefono non valido (solo numeri, 8-15 cifre)");
return false;
}

return true;
}

function aggiungi() {
let persona = {
nome: document.getElementById("nome").value,
cognome: document.getElementById("cognome").value,
eta: document.getElementById("eta").value,
citta: document.getElementById("citta").value,
provincia: document.getElementById("provincia").value,
nazione: document.getElementById("nazione").value,
cap: document.getElementById("cap").value,
email: document.getElementById("email").value,
telefono: document.getElementById("telefono").value
};

if (!persona.nome || !persona.cognome || !persona.eta) {
alert("Compila almeno nome, cognome ed età!");
return;
}

// VALIDAZIONE
if (!validaInput(persona)) return;

let elenco = JSON.parse(localStorage.getItem("anagrafica"));
elenco.push(persona);
localStorage.setItem("anagrafica", JSON.stringify(elenco));

aggiornaTabella();
pulisciCampi();
}

function aggiornaTabella() {
let elenco = JSON.parse(localStorage.getItem("anagrafica"));

let tab = "<table>";
tab += "<tr><th>Nome</th><th>Cognome</th><th>Età</th><th>Città</th><th>Provincia</th><th>Nazione</th><th>CAP</th><th>Email</th><th>Telefono</th></tr>";

for (let p of elenco) {
tab += "<tr>" +
"<td>" + p.nome + "</td>" +
"<td>" + p.cognome + "</td>" +
"<td>" + p.eta + "</td>" +
"<td>" + p.citta + "</td>" +
"<td>" + p.provincia + "</td>" +
"<td>" + p.nazione + "</td>" +
"<td>" + p.cap + "</td>" +
"<td>" + p.email + "</td>" +
"<td>" + p.telefono + "</td>" +
"</tr>";
}

tab += "</table>";
document.getElementById("risultato").innerHTML = tab;
}

function pulisciCampi() {
document.getElementById("nome").value = "";
document.getElementById("cognome").value = "";
document.getElementById("eta").value = "";
document.getElementById("citta").value = "";
document.getElementById("provincia").value = "";
document.getElementById("nazione").value = "";
document.getElementById("cap").value = "";
document.getElementById("email").value = "";
document.getElementById("telefono").value = "";
}

window.onload = aggiornaTabella;
</script>
</head>

<body>
<h2>Anagrafica Completa</h2>

<input type="text" id="nome" placeholder="Nome"><br>
<input type="text" id="cognome" placeholder="Cognome"><br>
<input type="number" id="eta" placeholder="Età"><br>
<input type="text" id="citta" placeholder="Città"><br>
<input type="text" id="provincia" placeholder="Provincia"><br>
<input type="text" id="nazione" placeholder="Nazione"><br>

<input type="text" id="cap" placeholder="CAP"><br>
<input type="email" id="email" placeholder="Email"><br>
<input type="text" id="telefono" placeholder="Telefono"><br>

<button onclick="aggiungi()">Aggiungi</button>

<div id="risultato"></div>
</body>
</html>
